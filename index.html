
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Student Task Manager</h1>
            <p>Organize your study tasks and stay productive.</p>
        </header>

        <main>
            <section class="task-section">

                <h2>My Study Tasks</h2>
                <p class="description">
                    Keep track of your academic activities.
                </p>

                <div class="task-input">
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter a new task..."
                        aria-label="Enter a new task"
                    >
                    <button type="button" id="addTaskBtn">
                        Add Task
                    </button>
                </div>

                <p id="errorMessage"></p>

                <h3>My Tasks</h3>

                <div class="task-list" id="taskList">

                    <div class="task">
                        <span>Complete Software Project III report</span>
                        <span class="status pending">Pending</span>
                    </div>

                    <div class="task completed">
                        <span>Revise Artificial Intelligence notes</span>
                        <span class="status done">Completed</span>
                    </div>

                    <div class="task">
                        <span>Prepare presentation slides</span>
                        <span class="status pending">Pending</span>
                    </div>

                </div>
            </section>
        </main>

        <footer>
            <p>Student Task Manager &copy; 2026</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
